{% assign related = site.related_posts | slice: 0, site.related_blog_posts.max_related %}

{% if related.size > 0 %}
<section class="related-posts">
  <h2><span class="c-label">Read next</span></h2>
  <div class="c-entry-list">
    {% for post in related %}
      {% include blog_entry.html post=post %}
    {% endfor %}
  </div>
</section>
{% endif %}

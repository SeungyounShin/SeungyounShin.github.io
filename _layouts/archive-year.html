---
layout: default
---

<div class="post">

  <header class="post-header c-article-header">
    <h1 class="post-title">{{ page.date | date: "%Y" }}</h1>
    <p class="c-article-desc">An archive of posts from this year.</p>
  </header>

  <div class="c-entry-list">
    {% assign posts = page.posts | sort: "date" | reverse %}
    {% for post in posts %}
      {% include blog_entry.html post=post %}
    {% endfor %}
  </div>

</div>
